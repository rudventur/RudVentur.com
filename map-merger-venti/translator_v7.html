<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RudVentur Creator Map v7 (Flags)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--panel:#0d1117;--border:#1a2332;
  --green:#00ff41;--cyan:#00f0ff;--amber:#ffb800;--red:#ff3333;--purple:#c084fc;
  --text:#c9d1d9;--dim:#484f58;
  --glow-green:0 0 15px rgba(0,255,65,.5);
  --glow-cyan:0 0 15px rgba(0,240,255,.5);
  --map-font-size:28px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Fira Code',monospace;overflow:hidden}

#boot-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#boot-screen.fade-out{opacity:0;pointer-events:none}
#boot-text{font-size:clamp(11px,1.8vw,15px);color:var(--green);max-width:600px;padding:2rem;line-height:1.8;white-space:pre}
.cursor-blink::after{content:'█';animation:blink .6s step-end infinite}
@keyframes blink{50%{opacity:0}}

#header{position:fixed;top:0;left:0;right:0;z-index:800;background:linear-gradient(180deg,rgba(10,10,10,.97),rgba(10,10,10,.85));backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:.5rem 1rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#header h1{font-family:'Orbitron',monospace;font-size:clamp(12px,2vw,18px);color:var(--green);text-shadow:var(--glow-green);letter-spacing:2px;white-space:nowrap}
.hdr-btn{background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--dim);padding:4px 10px;border-radius:5px;font-family:'Fira Code',monospace;font-size:10px;cursor:pointer;transition:all .2s;white-space:nowrap}
.hdr-btn:hover{color:var(--text);border-color:var(--dim)}
.hdr-btn.active{color:var(--amber);border-color:var(--amber)}

/* ── REDIRECT (big modal) ── */
.redirect-wrap{position:relative;display:inline-block}
#redirect-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:1rem}
#redirect-overlay.show{display:flex}
#redirect-modal{background:var(--panel);border:1px solid var(--purple);border-radius:12px;max-width:600px;width:100%;box-shadow:0 0 50px rgba(192,132,252,.2)}
#redirect-modal .rm-head{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-family:'Orbitron';color:var(--purple)}
#redirect-modal .rm-head button{background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer}
.redirect-grid{display:flex;flex-direction:column;gap:12px;padding:1.5rem}
.redirect-card{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--purple);border-radius:8px;padding:18px 20px;font-family:'Fira Code',monospace;font-size:15px;cursor:pointer;transition:all .15s}
.redirect-card:hover{border-color:var(--purple);background:rgba(192,132,252,.08)}
.redirect-card.cur{color:var(--dim);cursor:default}
.redirect-card.cur:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
.redirect-card small{opacity:.7;font-size:.8em}

/* ── VIEW MODE MENU (logo click) ── */
.view-menu{display:none;position:fixed;background:#0a0a0a;border:1px solid var(--green);border-radius:8px;padding:6px;z-index:1100;min-width:240px;box-shadow:0 12px 40px rgba(0,0,0,.7);font-family:'Fira Code',monospace}
.view-menu.show{display:block}
.view-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-family:inherit;font-size:12px;padding:9px 10px;cursor:pointer;border-radius:5px}
.view-menu button:hover{background:rgba(0,255,65,.1);color:var(--green)}
.view-menu .menu-sep{border-top:1px solid var(--border);margin:4px 2px}
.view-menu .settings-toggle{display:flex;align-items:center;justify-content:space-between}
.view-menu .settings-toggle::after{content:'▸';font-size:.8rem;transition:transform .2s}
.view-menu .settings-toggle.open::after{transform:rotate(90deg)}
.view-submenu{display:none;padding-left:.6rem;margin:0 .2rem;border-left:2px solid var(--border)}
.view-submenu.open{display:block}
.view-submenu button{font-size:11px;color:var(--dim)}

.size-control{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.size-control label{font-size:10px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px}
input[type=range]{-webkit-appearance:none;height:4px;background:#333;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);cursor:pointer}

#translate-bar{position:fixed;top:55px;left:0;right:0;z-index:799;background:rgba(13,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#base-lang-select{background:var(--bg);color:var(--amber);border:1px solid rgba(255,184,0,.3);padding:5px 8px;border-radius:4px;font-family:'Fira Code',monospace;font-size:12px;cursor:pointer;max-width:150px}
#translate-input{flex:1;min-width:150px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:#fff;padding:7px 12px;border-radius:5px;font-family:'Fira Code',monospace;font-size:14px;transition:border-color .2s}
#translate-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 8px rgba(0,255,65,.15)}
.tb-btn{padding:7px 14px;border-radius:5px;font-family:'Fira Code',monospace;font-size:12px;cursor:pointer;transition:all .2s}
#btn-translate{background:rgba(0,255,65,.1);border:1px solid rgba(0,255,65,.3);color:var(--green)}
#btn-clear{background:rgba(255,51,51,.08);border:1px solid rgba(255,51,51,.25);color:var(--red)}
#translate-status{width:100%;font-size:10px;color:var(--dim);margin-top:2px}

/* MOVE INSTRUCTIONS */
#move-instructions{position:fixed;top:105px;left:50%;transform:translateX(-50%);z-index:900;background:rgba(255,184,0,.12);border:1px solid var(--amber);color:var(--amber);padding:8px 20px;border-radius:8px;font-size:12px;text-align:center;display:none;pointer-events:none;animation:fade-pulse 1.5s ease-in-out infinite}
@keyframes fade-pulse{0%,100%{opacity:.7}50%{opacity:1}}

/* LANG TOGGLES */
#toggle-btn{position:fixed;top:110px;left:10px;z-index:799;background:rgba(13,17,23,.9);border:1px solid var(--border);color:var(--cyan);padding:4px 10px;border-radius:5px;font-family:'Fira Code',monospace;font-size:11px;cursor:pointer}
#lang-toggles{position:fixed;top:105px;left:10px;z-index:798;background:rgba(13,17,23,.92);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:8px;padding:8px;max-height:calc(100vh - 200px);overflow-y:auto;width:260px;display:none}
#lang-toggles.open{display:block}
.lang-check{display:flex;align-items:center;gap:6px;padding:4px 4px;cursor:pointer;font-size:11px;border-radius:3px}
.lang-check:hover{background:rgba(255,255,255,.04)}
.lang-check input[type=checkbox]{accent-color:var(--green);cursor:pointer;flex-shrink:0}
.lang-check .flag-sm{font-size:14px;flex-shrink:0}
.lang-check label{cursor:pointer;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-check input[type=range]{width:50px;flex-shrink:0}
.ctrl-row{display:flex;gap:4px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.ctrl-row button{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--dim);padding:3px;border-radius:3px;font-family:'Fira Code';font-size:9px;cursor:pointer}
.ctrl-row button:hover{color:var(--text)}

/* MAP */
#map{position:fixed;inset:0;top:100px;z-index:1}
.leaflet-container{background:var(--bg)!important}
/* Move zoom to right */
.leaflet-top.leaflet-left .leaflet-control-zoom{display:none}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--green)!important;border-color:var(--border)!important}

/* MARKERS */
.lang-marker{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;transition:all .2s}
.lang-marker.hidden{opacity:0;pointer-events:none}
.lang-marker.selected .lang-flag{animation:flag-blink .5s step-end infinite}
@keyframes flag-blink{50%{opacity:.2}}
.lang-flag{font-size:22px;line-height:1;filter:drop-shadow(0 0 4px rgba(0,0,0,.8));transition:transform .15s;flex-shrink:0}
.lang-marker:hover .lang-flag{transform:scale(1.3)}
.lang-label{font-family:'Orbitron',monospace;font-weight:900;color:var(--text);text-shadow:2px 2px 0px #000,0 0 10px rgba(0,0,0,.9);pointer-events:none;line-height:1;white-space:nowrap}
.lang-marker:hover .lang-label{color:#fff;text-shadow:0 0 15px var(--green)}
.lang-label.translated{color:var(--purple);font-weight:900;text-shadow:2px 2px 0 #000,0 0 15px rgba(192,132,252,.6)}

/* SIDE PANEL */
#side-panel{position:fixed;top:100px;right:0;bottom:0;width:480px;max-width:92vw;z-index:900;background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .35s;overflow-y:auto;display:flex;flex-direction:column}
#side-panel.open{transform:translateX(0)}
#panel-close{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer;z-index:10}
#panel-content{padding:1.5rem;flex:1}
.panel-lang-name{font-family:'Orbitron',monospace;font-size:clamp(28px,5vw,42px);margin-bottom:4px}
.panel-country{font-size:14px;color:var(--dim);margin-bottom:1.5rem;text-transform:uppercase;letter-spacing:1px}
.panel-section{margin-bottom:1.5rem}
.panel-section-title{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:.6rem;border-bottom:1px solid var(--border);padding-bottom:4px}
.phrase-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:6px;padding:12px 15px;margin-bottom:8px}
.phrase-en{font-size:12px;color:var(--dim);text-transform:uppercase}
.phrase-tl{font-size:20px;color:#fff;margin:4px 0;font-family:'Orbitron'}
.hello-big{font-size:clamp(40px,6vw,56px);font-weight:900;margin:6px 0;line-height:1.1}
.alphabet-display{background:rgba(0,0,0,.3);border:1px solid var(--border);padding:15px;border-radius:8px;font-size:16px;line-height:1.8;color:var(--cyan);word-break:break-all;margin-top:10px;max-height:200px;overflow-y:auto}
.dialect-badge{display:inline-block;background:var(--cyan);color:#000;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold;margin-left:8px;vertical-align:middle}
.panel-size-control{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;background:rgba(0,0,0,.2);border-radius:6px;border:1px solid var(--border)}
.panel-size-control label{font-size:10px;color:var(--cyan)}
.panel-size-control input[type=range]{flex:1}
.panel-size-control .sz-val{font-size:11px;color:var(--amber);min-width:30px;text-align:right}

/* GRAMMAR MODAL */
#grammar-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:1rem}
#grammar-modal{background:var(--panel);border:1px solid var(--green);border-radius:12px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 0 50px rgba(0,255,65,.15)}
#grammar-body{padding:1.5rem}

/* FOOTER */
#footer{position:fixed;bottom:0;left:0;right:0;z-index:800;background:linear-gradient(0deg,rgba(10,10,10,.95),rgba(10,10,10,.6));border-top:1px solid var(--border);padding:5px 1rem;font-size:10px;color:var(--dim);display:flex;justify-content:space-between}

/* RIGHT SIDE CONTROLS (zoom + clear) */
#right-controls{position:fixed;top:110px;right:12px;z-index:799;display:flex;flex-direction:column;gap:4px}
#right-controls button{width:34px;height:34px;background:var(--panel);border:1px solid var(--border);color:var(--green);font-size:18px;cursor:pointer;border-radius:4px;font-family:'Fira Code';display:flex;align-items:center;justify-content:center;transition:all .15s}
#right-controls button:hover{background:rgba(0,255,65,.1);border-color:var(--green)}

@media(max-width:600px){
  #side-panel{top:auto;bottom:0;height:65vh;transform:translateY(100%);border-radius:16px 16px 0 0}
  #side-panel.open{transform:translateY(0)}
  .lang-label{font-size:18px!important}
  #header h1{font-size:14px}
  #lang-toggles{width:220px}
}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div id="boot-screen"><div id="boot-text"></div></div>

<div id="header">
  <h1 onclick="toggleViewMenu(event)" style="cursor:pointer" title="View options">🗺️ CREATOR MAP v7</h1>
  <div class="size-control">
    <label>ALL SIZE</label>
    <input type="range" id="sizeSlider" min="12" max="48" value="28" style="width:80px" oninput="updateGlobalSize(this.value)">
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
    <button class="hdr-btn" id="btn-move" onclick="toggleMoveMode()">📌 MOVE</button>
    <button class="hdr-btn" onclick="randomiseAll()" title="Randomise sizes, zoom, position">🎲 RANDOM</button>
    <button class="hdr-btn" onclick="saveToTxt()" title="Save state to .txt">💾 SAVE</button>
    <button class="hdr-btn" onclick="loadFromTxt()" title="Load state from .txt">📂 LOAD</button>
    <button class="hdr-btn" onclick="resetAllState()">↺ RESET</button>
    <div class="redirect-wrap">
      <button class="hdr-btn" style="color:var(--purple);border-color:var(--purple)" onclick="openRedirectMenu(event)">&#128257; REDIRECT</button>
    </div>
    <span style="font-size:10px;color:var(--dim)">RV©26</span>
  </div>
</div>

<!-- VIEW MODE MENU (logo click) -->
<div class="view-menu" id="viewMenu">
  <button onclick="setView('horizontal')">Full Screen Horizontal</button>
  <button onclick="setView('panoramic')">Full Screen Panoramic</button>
  <button onclick="setView('normal')">Normal / Default Browser</button>
  <div class="menu-sep"></div>
  <button class="settings-toggle" onclick="toggleSettingsSubmenu(event)">Settings One</button>
  <div class="view-submenu" id="viewSubmenu">
    <button onclick="setView('horizontal')">&#8618; Panoramic — Locked</button>
    <button onclick="setView('panoramic')">&#8618; Panoramic — Default Rotation</button>
    <button onclick="setView('vertical')">&#8618; Full Screen Vertical</button>
  </div>
</div>

<!-- REDIRECT — big modal; destinations open in a new tab carrying the current view mode -->
<div id="redirect-overlay" onclick="if(event.target===this) closeRedirectMenu()">
  <div id="redirect-modal">
    <div class="rm-head">
      <span>&#128257; Redirect</span>
      <button onclick="closeRedirectMenu()">✕</button>
    </div>
    <div class="redirect-grid">
      <span class="redirect-card cur">&#127760; Translator <small>(here)</small></span>
      <button class="redirect-card" onclick="goTo('index.html')">&#128506;&#65039; Map Merger</button>
      <button class="redirect-card" onclick="goTo('snout-first.html')">&#128062; Snout First</button>
    </div>
  </div>
</div>

<script>
// ── View mode (Full Screen Horizontal / Panoramic / Vertical / Normal) ──
// Shared with index.html (the RUDVENTUR hub) and snout-first.html via the
// same localStorage key, so "Redirect" can carry the current mode across tabs.
const VIEW_MODE_KEY = 'rvViewMode';

function requestFS() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  return fn ? fn.call(el).catch(() => {}) : Promise.resolve();
}
function exitFS() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) return Promise.resolve();
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  return fn ? fn.call(document).catch(() => {}) : Promise.resolve();
}
function lockOrientation(type) {
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock(type).catch(() => {}); } catch (e) {}
}
function unlockOrientation() {
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
}
function applyViewMode(mode) {
  switch (mode) {
    case 'horizontal': requestFS().then(() => lockOrientation('landscape')); break;
    case 'panoramic':  requestFS().then(() => unlockOrientation()); break;
    case 'vertical':   requestFS().then(() => lockOrientation('portrait')); break;
    case 'normal':      unlockOrientation(); exitFS(); break;
  }
}
function currentViewMode() {
  return localStorage.getItem(VIEW_MODE_KEY) || '';
}
function setView(mode) {
  localStorage.setItem(VIEW_MODE_KEY, mode);
  closeViewMenu();
  applyViewMode(mode);
}

// Adopt ?view= from a Redirect link (highest priority), else fall back to the
// last mode chosen on this device. Fullscreen needs a real user gesture, so
// it's applied on the first click/touch rather than immediately on load.
let pendingViewMode = null;
(function initViewModeFromNavigation() {
  const params = new URLSearchParams(location.search);
  const urlMode = params.get('view');
  if (urlMode) {
    localStorage.setItem(VIEW_MODE_KEY, urlMode);
    params.delete('view');
    const clean = location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash;
    history.replaceState(null, '', clean);
    pendingViewMode = urlMode;
  } else {
    pendingViewMode = localStorage.getItem(VIEW_MODE_KEY);
  }
})();
document.addEventListener('pointerdown', function once() {
  document.removeEventListener('pointerdown', once);
  if (pendingViewMode && pendingViewMode !== 'normal') applyViewMode(pendingViewMode);
}, { once: true });

// ── View mode menu (logo click) ──
function toggleViewMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('viewMenu');
  if (menu.classList.contains('show')) { closeViewMenu(); return; }
  const rect = e.currentTarget.getBoundingClientRect();
  menu.style.top = (rect.bottom + 8) + 'px';
  menu.style.left = Math.min(Math.max(rect.left, 8), window.innerWidth - 248) + 'px';
  menu.classList.add('show');
}
function closeViewMenu() {
  document.getElementById('viewMenu').classList.remove('show');
  document.getElementById('viewSubmenu').classList.remove('open');
  document.querySelector('.settings-toggle').classList.remove('open');
}
function toggleSettingsSubmenu(e) {
  e.stopPropagation();
  document.getElementById('viewSubmenu').classList.toggle('open');
  e.currentTarget.classList.toggle('open');
}

// ── Redirect (big modal) — opens the destination in a new tab, in the current view mode ──
function openRedirectMenu(e) {
  e.stopPropagation();
  document.getElementById('redirect-overlay').classList.add('show');
}
function closeRedirectMenu() {
  document.getElementById('redirect-overlay').classList.remove('show');
}
function goTo(url) {
  closeRedirectMenu();
  const mode = currentViewMode();
  const qs = mode && mode !== 'normal' ? '?view=' + encodeURIComponent(mode) : '';
  window.open(url + qs, '_blank', 'noopener');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.view-menu') && !e.target.closest('#header h1')) closeViewMenu();
});
</script>

<script>
// ========================================================================
//  FLAG EMOJI MAP — country code to emoji
// ========================================================================

let map, markers = [];
let checkedLangs = new Set();
let currentTranslations = {};
let translatingActive = false;
let baseLang = 'en';
let moveMode = false;
let selectedMarker = null;
let langSizes = {}; // { code: px }

// ========================================================================
//  PERSISTENCE
// ========================================================================
const STORE_KEY = 'rudventur-map-v7';
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
    return s;
  }catch(e){return{}}
}
function saveState(){
  const positions = {};
  markers.forEach(m=>{
    const ll=m.getLatLng(), o=m._langData;
    if(Math.abs(ll.lat-o.lat)>0.01||Math.abs(ll.lng-o.lng)>0.01) positions[o.code]={lat:ll.lat,lng:ll.lng};
  });
  const checked = [...checkedLangs];
  localStorage.setItem(STORE_KEY, JSON.stringify({positions, sizes:langSizes, checked}));
}
function resetAllState(){
  if(!confirm('Reset ALL positions, sizes, and selections to default?')) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
}

// ========================================================================
// Build boot lines — each line a random language hello
function buildBootLines(){
  const shuffled=[...LANGUAGES].sort(()=>Math.random()-.5);
  const picks=shuffled.slice(0,6);
  const lines=["> RUDVENTUR TRANSLATOR MAP v7"];
  picks.forEach(l=>{
    const flag=FLAGS[l.code]||'🏳️';
    lines.push(`> ${flag} ${l.name}: ${l.hello.text}`);
  });
  lines.push("> "+LANGUAGES.length+" languages loaded");
  lines.push("Ready to explore. 🗺️");
  return lines;
}
(function(){
  const bootLines=buildBootLines();
  const el=document.getElementById('boot-text');let li=0,ci=0,txt='';
  function tick(){
    if(li>=bootLines.length){el.classList.add('cursor-blink');setTimeout(()=>{document.getElementById('boot-screen').classList.add('fade-out');setTimeout(initApp,600)},400);return}
    const line=bootLines[li];
    if(ci<line.length){txt+=line[ci];ci++;el.textContent=txt;setTimeout(tick,10)}
    else{txt+='\n';li++;ci=0;el.textContent=txt;setTimeout(tick,50)}
  }
  tick();
})();

function initApp(){
  const saved = loadState();
  if(saved.sizes) langSizes = saved.sizes;
  if(saved.checked){
    checkedLangs = new Set(saved.checked);
  } else {
    LANGUAGES.filter(l=>l.tier==='major').forEach(l=>checkedLangs.add(l.code));
  }
  initMap(saved.positions||{});
  initBaseLangSelect();
  initLangCheckboxes();
  initTranslateBar();
}

// ========================================================================
//  MAP
// ========================================================================
function initMap(savedPositions){
  map = L.map('map',{center:[50,15],zoom:4,zoomControl:false,attributionControl:false,minZoom:2,maxZoom:10});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

  LANGUAGES.forEach(lang=>{
    const flag = FLAGS[lang.code]||'🏳️';
    const sz = langSizes[lang.code] || 28;
    const icon = L.divIcon({
      className:'',
      html:`<div class="lang-marker" data-code="${lang.code}" id="marker-${lang.code}">
        <span class="lang-flag">${flag}</span>
        <span class="lang-label" id="label-${lang.code}" style="font-size:${sz}px">${lang.name}</span>
      </div>`,
      iconSize:[null,null],iconAnchor:[11,11],
    });
    const pos = savedPositions[lang.code]||{lat:lang.lat,lng:lang.lng};
    const m = L.marker([pos.lat,pos.lng],{icon}).addTo(map);
    m._langData = lang;
    m.on('click', ()=> onMarkerClick(m));
    markers.push(m);
  });

  // Click on map to move selected marker
  map.on('click', e=>{
    if(moveMode && selectedMarker){
      selectedMarker.setLatLng(e.latlng);
      deselectMarker();
      saveState();
      setTimeout(resolveCollisions,100);
    }
  });

  updateVisibility();
  setTimeout(resolveCollisions,500);
  map.on('zoomend moveend',()=>{updateVisibility();resolveCollisions()});
}

function onMarkerClick(m){
  if(moveMode){
    if(selectedMarker === m){
      deselectMarker();
    } else {
      deselectMarker();
      selectedMarker = m;
      const el = document.getElementById('marker-'+m._langData.code);
      if(el) el.classList.add('selected');
    }
  } else {
    openPanel(m._langData);
  }
}

function deselectMarker(){
  if(selectedMarker){
    const el = document.getElementById('marker-'+selectedMarker._langData.code);
    if(el) el.classList.remove('selected');
    selectedMarker = null;
  }
}

function toggleMoveMode(){
  moveMode = !moveMode;
  const btn = document.getElementById('btn-move');
  const instr = document.getElementById('move-instructions');
  btn.classList.toggle('active', moveMode);
  btn.textContent = moveMode ? '📌 MOVING...' : '📌 MOVE';
  instr.style.display = moveMode ? 'block' : 'none';
  if(!moveMode) deselectMarker();
}

function resolveCollisions(){
  // Measure actual label widths for better collision detection
  markers.forEach(m=>{const el=m.getElement();if(el){el.classList.remove('hidden');el.style.opacity='1'}});
  const vis = markers.filter(m=>{
    const el=m.getElement();
    if(!el) return false;
    if(!checkedLangs.has(m._langData.code)) return false;
    return el.style.display!=='none';
  });
  // Sort by priority: major > regional > minority, then by speakers count
  const tierVal=t=>t==='major'?3:t==='regional'?2:1;
  vis.sort((a,b)=>tierVal(b._langData.tier)-tierVal(a._langData.tier));
  const placed=[];
  vis.forEach(m=>{
    const el=m.getElement();if(!el)return;
    const p=map.latLngToContainerPoint(m.getLatLng());
    const sz=langSizes[m._langData.code]||parseInt(getComputedStyle(document.documentElement).getPropertyValue('--map-font-size'))||28;
    // Estimate label width based on font size and name length
    const lbl=document.getElementById('label-'+m._langData.code);
    const txt=lbl?lbl.textContent:m._langData.name;
    const estW=txt.length*sz*0.55+30; // flag + gap
    const estH=sz*1.2;
    const rect={x:p.x-11,y:p.y-estH/2,w:estW,h:estH};
    // Check overlap with already placed labels
    let overlaps=false;
    for(const pr of placed){
      if(rect.x<pr.x+pr.w && rect.x+rect.w>pr.x && rect.y<pr.y+pr.h && rect.y+rect.h>pr.y){
        overlaps=true;break;
      }
    }
    if(overlaps){el.classList.add('hidden');el.style.opacity='0'}
    else{placed.push(rect)}
  });
}

function updateVisibility(){
  const z=map.getZoom();
  markers.forEach(m=>{
    const el=m.getElement();if(!el)return;
    const visible=z>=m._langData.minZoom && checkedLangs.has(m._langData.code);
    el.style.display=visible?'':'none';
  });
}

function updateGlobalSize(val){
  document.documentElement.style.setProperty('--map-font-size',val+'px');
  // Update all labels that don't have custom size
  LANGUAGES.forEach(l=>{
    if(!langSizes[l.code]){
      const lbl=document.getElementById('label-'+l.code);
      if(lbl)lbl.style.fontSize=val+'px';
    }
  });
  setTimeout(resolveCollisions,100);
}

function setLangSize(code, val){
  langSizes[code]=parseInt(val);
  const lbl=document.getElementById('label-'+code);
  if(lbl) lbl.style.fontSize=val+'px';
  // Update slider in side panel if open
  const ps=document.getElementById('panel-slider');
  if(ps&&ps.dataset.code===code) ps.value=val;
  // Update slider in checkbox panel
  const cs=document.getElementById('sz-'+code);
  if(cs) cs.value=val;
  // Update map slider display
  const sv=document.getElementById('szv-'+code);
  if(sv) sv.textContent=val+'px';
  const psv=document.getElementById('panel-sz-val');
  if(psv&&ps&&ps.dataset.code===code) psv.textContent=val+'px';
  saveState();
  setTimeout(resolveCollisions,100);
}

      </div>`;
      const brContent=document.createElement('div');
      brContent.style.cssText='display:none;padding-left:12px';
      brContent.className='tree-branch-content';
      codes.forEach(code=>{
        const lang=langMap[code];
        if(!lang)return;
        const flag=FLAGS[code]||'🏳️';
        const sz=langSizes[code]||28;
        const div=document.createElement('div');div.className='lang-check';

          <input type="checkbox" id="chk-${code}" value="${code}" ${checkedLangs.has(code)?'checked':''}>
          <span class="flag-sm">${flag}</span>
          <label for="chk-${code}" style="flex:1">${lang.name}</label>

function initTranslateBar(){
  document.getElementById('btn-translate').addEventListener('click',doTranslate);
  document.getElementById('translate-input').addEventListener('keydown',e=>{if(e.key==='Enter')doTranslate()});
  document.getElementById('btn-clear').addEventListener('click',()=>{
    currentTranslations={};translatingActive=false;document.getElementById('translate-input').value='';
    const s=document.getElementById('translate-status');if(s)s.textContent='';updateMapLabels();
  });
}

async function doTranslate(){
  const input=document.getElementById('translate-input'),status=document.getElementById('translate-status'),btn=document.getElementById('btn-translate');
  if(!status)return;
  const text=input.value.trim();if(!text)return;
  const targets=LANGUAGES.filter(l=>checkedLangs.has(l.code)&&l.code!==baseLang);
  btn.disabled=true;btn.textContent='TRANSLATING...';status.textContent=`> Translating "${text}"...`;
  currentTranslations={};translatingActive=true;
  let done=0;
  for(let i=0;i<targets.length;i+=3){
    const batch=targets.slice(i,i+3);
    await Promise.all(batch.map(async lang=>{
      try{
        const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${baseLang}|${lang.code}`;
        const res=await fetch(url);const data=await res.json();
        if(data.responseStatus===200)currentTranslations[lang.code]=data.responseData.translatedText;
      }catch(e){console.warn('Fail',lang.name)}
      done++;status.textContent=`> ${done}/${targets.length} complete`;updateMapLabels();
    }));
  }
  btn.disabled=false;btn.textContent='TRANSLATE ⚡';status.textContent='> Done.';updateMapLabels();
}

function updateMapLabels(){
  LANGUAGES.forEach(lang=>{
    const lbl=document.getElementById('label-'+lang.code);if(!lbl)return;
    if(translatingActive&&currentTranslations[lang.code]){lbl.textContent=currentTranslations[lang.code];lbl.classList.add('translated')}
    else{lbl.textContent=lang.name;lbl.classList.remove('translated')}
  });
  setTimeout(resolveCollisions,200);
}

function randomiseAll(){
  // Random zoom 2-7
  const rz=2+Math.floor(Math.random()*6);
  map.setZoom(rz);
  // Random center somewhere in Europe-ish
  const lat=35+Math.random()*30;
  const lng=-10+Math.random()*50;
  map.panTo([lat,lng]);
  // Random sizes for all languages
  LANGUAGES.forEach(l=>{
    const sz=14+Math.floor(Math.random()*34);
    langSizes[l.code]=sz;
    const lbl=document.getElementById('label-'+l.code);
    if(lbl)lbl.style.fontSize=sz+'px';
    const sldr=document.getElementById('sz-'+l.code);
    if(sldr)sldr.value=sz;
    const sv=document.getElementById('szv-'+l.code);
    if(sv)sv.textContent=sz+'px';
  });
  // Random selection: enable 40-70% of languages
  checkedLangs.clear();
  const shuffled=[...LANGUAGES].sort(()=>Math.random()-.5);
  const count=Math.floor(LANGUAGES.length*(0.4+Math.random()*0.3));
  shuffled.slice(0,count).forEach(l=>{
    checkedLangs.add(l.code);
    const cb=document.getElementById('chk-'+l.code);
    if(cb)cb.checked=true;
  });
  // Uncheck the rest
  LANGUAGES.forEach(l=>{
    if(!checkedLangs.has(l.code)){
      const cb=document.getElementById('chk-'+l.code);
      if(cb)cb.checked=false;
    }
  });
  // Update global slider to random
  const globalSz=18+Math.floor(Math.random()*22);
  document.getElementById('sizeSlider').value=globalSz;
  document.documentElement.style.setProperty('--map-font-size',globalSz+'px');
  saveState();
  updateVisibility();
  setTimeout(resolveCollisions,300);
}

// ========================================================================
//  SAVE / LOAD to TXT file
// ========================================================================
function saveToTxt(){
  const positions={};
  markers.forEach(m=>{
    const ll=m.getLatLng(),o=m._langData;
    positions[o.code]={lat:ll.lat,lng:ll.lng};
  });
  const state={
    version:'rv-translator-v7',
    timestamp:new Date().toISOString(),
    mapCenter:{lat:map.getCenter().lat,lng:map.getCenter().lng},
    mapZoom:map.getZoom(),
    globalSize:document.getElementById('sizeSlider').value,
    positions,
    sizes:langSizes,
    checked:[...checkedLangs],
    translations:currentTranslations,
    baseLang
  };
  const txt=JSON.stringify(state,null,2);
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='rudventur-translator-'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadFromTxt(){
  const input=document.createElement('input');
  input.type='file';input.accept='.txt';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const state=JSON.parse(ev.target.result);
        if(state.version!=='rv-translator-v7'){alert('Not a valid RudVentur translator save file.');return}
        // Restore map view
        if(state.mapCenter)map.setView([state.mapCenter.lat,state.mapCenter.lng],state.mapZoom||4);
        // Restore sizes
        if(state.sizes){
          langSizes=state.sizes;
          Object.entries(langSizes).forEach(([code,sz])=>{
            const lbl=document.getElementById('label-'+code);if(lbl)lbl.style.fontSize=sz+'px';
            const sldr=document.getElementById('sz-'+code);if(sldr)sldr.value=sz;
            const sv=document.getElementById('szv-'+code);if(sv)sv.textContent=sz+'px';
          });
        }
        // Restore global size
        if(state.globalSize){
          document.getElementById('sizeSlider').value=state.globalSize;
          document.documentElement.style.setProperty('--map-font-size',state.globalSize+'px');
        }
        // Restore positions
        if(state.positions){
          markers.forEach(m=>{
            const pos=state.positions[m._langData.code];
            if(pos)m.setLatLng([pos.lat,pos.lng]);
          });
        }
        // Restore checked languages
        if(state.checked){
          checkedLangs=new Set(state.checked);
          document.querySelectorAll('#lang-checks-list input[type=checkbox]').forEach(cb=>{
            cb.checked=checkedLangs.has(cb.value);
          });
        }
        // Restore translations
        if(state.translations){
          currentTranslations=state.translations;
          translatingActive=Object.keys(currentTranslations).length>0;
          updateMapLabels();
        }
        if(state.baseLang){
          baseLang=state.baseLang;
          document.getElementById('base-lang-select').value=baseLang;
        }
        saveState();
        updateVisibility();
        setTimeout(resolveCollisions,300);
      }catch(err){alert('Error loading file: '+err.message)}
    };
    reader.readAsText(file);
  };
  input.click();
}
