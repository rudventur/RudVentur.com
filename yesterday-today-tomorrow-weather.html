<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather News — RudVentur</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;
  --social:#ff3c78;
}
body{
  background:var(--bg);
  color:#ccc;
  font-family:'DM Mono',monospace;
  min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:60px 60px;
  z-index:0;pointer-events:none;
}
.back-wrap{text-align:center;position:relative;z-index:2;padding-top:1.5rem}
a.back{
  display:inline-block;
  color:#777;
  text-decoration:none;
  font-size:.75rem;
  border:1px solid #2a2a2a;
  padding:.4rem .8rem;
  border-radius:6px;
  transition:all .2s;
}
a.back:hover{color:var(--social);border-color:var(--social)}
header{
  position:relative;z-index:2;
  text-align:center;
  padding:1.25rem 1rem;
}
header h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.8rem,5vw,3rem);
  letter-spacing:3px;
  color:var(--social);
  text-shadow:0 0 30px rgba(255,60,120,.15);
}
header .tagline{
  margin-top:.4rem;
  font-size:.75rem;
  color:#777;
  letter-spacing:1px;
}
.refresh-row{
  text-align:center;position:relative;z-index:2;
  margin-bottom:1.5rem;
}
#refresh-btn{
  background:#0e0e10;color:var(--social);border:1px solid #3a0a1a;
  padding:.5rem 1.1rem;border-radius:8px;font-family:'DM Mono',monospace;
  font-size:.75rem;cursor:pointer;letter-spacing:.5px;
}
#refresh-btn:hover{background:#1a0a10}
#last-updated{font-size:.65rem;color:#555;margin-top:.5rem}
main{
  position:relative;z-index:2;
  max-width:720px;
  margin:0 auto;
  padding:0 1rem 4rem;
}
#status{
  text-align:center;
  color:#666;
  font-size:.8rem;
  padding:2rem 0;
}
.item{
  display:flex;
  gap:1rem;
  padding:1rem 0;
  border-bottom:1px solid #1c1c1c;
}
.item img{
  width:96px;height:72px;object-fit:cover;border-radius:6px;
  background:#111;flex-shrink:0;
}
.item .body{min-width:0}
.item h3{
  font-size:.92rem;
  font-weight:500;
  color:#eee;
  margin-bottom:.3rem;
  line-height:1.3;
}
.item h3 a{color:inherit;text-decoration:none}
.item h3 a:hover{color:var(--social)}
.item p{
  font-size:.75rem;color:#888;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.item .meta{margin-top:.35rem;font-size:.65rem;color:#555;letter-spacing:.5px}
</style>
</head>
<body>

<div class="back-wrap"><a class="back" href="index.html">&larr; RUDVENTUR</a></div>

<header>
  <h1>🌦️ Weather News</h1>
  <div class="tagline">live feed — yesterday, today, tomorrow</div>
</header>

<div class="refresh-row">
  <button id="refresh-btn" onclick="loadFeed()">↻ REFRESH</button>
  <div id="last-updated"></div>
</div>

<main>
  <div id="status">Loading live feed…</div>
  <div id="items"></div>
</main>

<script src="/embed/useRbox.js" defer></script>
<script>
const FEED_URL = 'https://rss.app/feeds/tRcMwW2Kz8Jl5nNn.xml';
const REFRESH_MS = 5 * 60 * 1000;

function stripHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
}

function safeUrl(raw) {
  try {
    const u = new URL(raw, location.href);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
  } catch {
    return '';
  }
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}

function tagText(item, tag) {
  const el = item.getElementsByTagName(tag)[0];
  return el ? (el.textContent || '').trim() : '';
}

async function loadFeed() {
  const statusEl = document.getElementById('status');
  const itemsEl = document.getElementById('items');
  statusEl.style.display = 'block';
  statusEl.textContent = 'Loading live feed…';

  try {
    const res = await fetch(FEED_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const xmlText = await res.text();
    const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
    if (xml.querySelector('parsererror')) throw new Error('feed parse error');

    const items = [...xml.getElementsByTagName('item')].map(item => {
      const media = item.getElementsByTagName('media:content')[0];
      return {
        title: tagText(item, 'title'),
        link: safeUrl(tagText(item, 'link')),
        creator: tagText(item, 'dc:creator'),
        pubDate: tagText(item, 'pubDate'),
        snippet: stripHtml(tagText(item, 'description')),
        image: media ? safeUrl(media.getAttribute('url') || '') : ''
      };
    });

    if (!items.length) {
      statusEl.textContent = 'No stories in the feed right now.';
      return;
    }

    statusEl.style.display = 'none';
    itemsEl.innerHTML = '';

    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'item';

      if (it.image) {
        const img = document.createElement('img');
        img.src = it.image;
        img.alt = '';
        img.loading = 'lazy';
        img.addEventListener('error', () => img.remove());
        row.appendChild(img);
      }

      const bodyDiv = document.createElement('div');
      bodyDiv.className = 'body';

      const h3 = document.createElement('h3');
      if (it.link) {
        const a = document.createElement('a');
        a.href = it.link;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = it.title || '(untitled)';
        h3.appendChild(a);
      } else {
        h3.textContent = it.title || '(untitled)';
      }

      const p = document.createElement('p');
      p.textContent = it.snippet;

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = [it.creator, timeAgo(it.pubDate)].filter(Boolean).join(' • ');

      bodyDiv.appendChild(h3);
      bodyDiv.appendChild(p);
      bodyDiv.appendChild(meta);
      row.appendChild(bodyDiv);
      itemsEl.appendChild(row);
    });

    document.getElementById('last-updated').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    statusEl.style.display = 'block';
    statusEl.textContent = 'Could not load the live feed (' + err.message + '). Try refresh.';
  }
}

loadFeed();
setInterval(loadFeed, REFRESH_MS);
</script>

</body>
</html>
